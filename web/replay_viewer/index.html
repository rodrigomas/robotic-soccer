<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robotic Soccer Replay Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="replay-list" aria-label="Replay catalog">
      <div class="brand-block">
        <span class="kicker">Robotic Soccer 2.0</span>
        <h1>Replay Viewer</h1>
      </div>
      <div id="catalog" class="catalog" aria-live="polite"></div>
    </aside>

    <section id="report" class="report" data-view="field" aria-label="Replay report">
      <header class="report-header">
        <div>
          <span id="run-id" class="kicker">No replay loaded</span>
          <h2 id="match-title">Replay dashboard</h2>
        </div>
        <div id="scoreline" class="scoreline">-</div>
      </header>

      <section id="metrics" class="metrics" aria-label="Match metrics"></section>

      <nav class="view-switch" aria-label="Replay focus">
        <button type="button" class="view-button active" data-view="field" aria-pressed="true">Field</button>
        <button type="button" class="view-button" data-view="timeline" aria-pressed="false">Timeline</button>
        <button type="button" class="view-button" data-view="heatmap" aria-pressed="false">Heatmap</button>
      </nav>

      <section class="analysis-grid focus-section field-focus">
        <div class="field-panel">
          <div class="panel-heading">
            <div>
              <h3>Field</h3>
              <span id="pass-lane-label">-</span>
            </div>
            <div class="layer-toggles" aria-label="Field overlays">
              <label><input id="toggle-pass-lanes" class="layer-toggle" type="checkbox" checked> Pass lanes</label>
              <label><input id="toggle-pressure" class="layer-toggle" type="checkbox" checked> Pressure</label>
            </div>
          </div>
          <svg id="field-view" class="field-view" viewBox="0 0 540 360" role="img" aria-label="Replay field view"></svg>
        </div>

        <div class="timeline-panel">
          <div class="panel-heading">
            <h3>Tactical Summary</h3>
            <span id="match-time">-</span>
          </div>
          <dl id="tactical-summary" class="tactical-summary"></dl>
        </div>

        <div class="event-detail-panel">
          <div class="panel-heading">
            <div>
              <h3>Selected Event</h3>
              <span id="event-detail-time">-</span>
            </div>
          </div>
          <dl id="event-detail" class="event-detail"></dl>
        </div>
      </section>

      <section class="timeline-strip focus-section" aria-label="Replay timeline">
        <div class="panel-heading">
          <h3>Timeline</h3>
          <span id="timeline-count">-</span>
        </div>
        <ol id="match-timeline" class="match-timeline"></ol>
      </section>

      <section class="heatmap-strip focus-section" aria-label="Replay heatmap">
        <div class="panel-heading">
          <h3>Heatmap</h3>
          <div class="heatmap-controls">
            <select id="heatmap-team-filter" aria-label="Heatmap team">
              <option value="all">All teams</option>
            </select>
            <select id="heatmap-entity-filter" aria-label="Heatmap entity">
              <option value="all">All entities</option>
            </select>
            <span id="heatmap-label">-</span>
          </div>
        </div>
        <svg id="heatmap-view" class="heatmap-view" viewBox="0 0 360 240" role="img" aria-label="Replay heatmap view"></svg>
      </section>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
